<script>
/* ============ EDIT ONLY THESE 4 LINES ============ */
/* Keep the quote marks. Only change the words inside them. */

var AWARD    = "Winner";
var YEAR     = "2019";
var EVENT    = "Hudson Valley Regional";
var LOGO_URL = "PASTE-LOGO-URL-HERE";

/* ================================================= */
</script>

<style>
@import url("https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap");
body { margin: 0; padding: 8px; background: transparent; }
.blue-banner {
  box-sizing: border-box;
  display: inline-block;
  position: relative;
  width: 140px;
  height: calc(140px * 5 / 3);
  padding: 8px;
  background: #0f4bcb;
  border-radius: 4px;
  color: #fff;
  font: 14px/1.2 Roboto, Arial, sans-serif;
  text-align: center;
  vertical-align: top;
  white-space: normal;
  filter: drop-shadow(0 5px 5px rgba(0, 0, 0, .1));
}
.blue-banner *, .blue-banner *::before, .blue-banner *::after { box-sizing: border-box; }
.blue-banner__logo {
  position: absolute;
  top: 12.5%;
  left: 50%;
  transform: translateX(-50%);
  width: 75px;
  max-width: none;
  max-height: 45px;
  height: auto;
  margin: 0;
}
.blue-banner__award {
  position: absolute;
  top: 44%;
  left: 8px;
  display: table;
  width: calc(100% - 16px);
  height: 19%;
  margin: 0;
  font-size: 110%;
  font-weight: 900;
}
.blue-banner__award span, .blue-banner__year span, .blue-banner__event span {
  display: table-cell;
  vertical-align: middle;
}
.blue-banner__award span { text-transform: uppercase; }
.blue-banner__award--first span { font-style: italic; }
.blue-banner__award--long span { font-size: 85%; }
.blue-banner__award--winner span { font-size: 135%; }
.blue-banner__year, .blue-banner__event {
  position: absolute;
  left: 8px;
  display: table;
  width: calc(100% - 16px);
  text-transform: uppercase;
}
.blue-banner__year {
  top: 64%;
  height: 7%;
  font-size: 110%;
  font-weight: 900;
}
.blue-banner__event {
  top: 72%;
  height: 20%;
  font-weight: 900;
  font-size: 100%;
  line-height: 120%;
  text-transform: uppercase;
}
.blue-banner__event--long { font-size: 75%; line-height: 110%; }
.blue-banner__event span { white-space: pre-line; max-width: 124px; overflow: hidden; text-overflow: ellipsis; }
</style>

<div class="blue-banner">
  <img class="blue-banner__logo" id="logo" alt="">
  <div class="blue-banner__award" id="award"><span></span></div>
  <div class="blue-banner__year" id="year"><span></span></div>
  <div class="blue-banner__event" id="event"><span></span></div>
</div>

<script>
(function () {
  var award = document.getElementById('award');
  var event = document.getElementById('event');

  document.getElementById('logo').src = LOGO_URL;
  award.firstChild.textContent = AWARD;
  document.getElementById('year').firstChild.textContent = YEAR;
  event.firstChild.textContent = EVENT;

  if (AWARD.length > 20) award.classList.add('blue-banner__award--long');
  if (AWARD.trim().toLowerCase() === 'winner') award.classList.add('blue-banner__award--winner');
  if (/\bFIRST\b/i.test(AWARD)) award.classList.add('blue-banner__award--first');
  if (EVENT.length > 28) event.classList.add('blue-banner__event--long');
})();
</script>
